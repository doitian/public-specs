SPECIFICATION Spec

\* Constants
CONSTANTS
    N = 3
    f = 1
    Values = {0, 1}

\* State constraint to limit state space
\* CONSTRAINT rounds are limited
CONSTRAINT
    \A p \in 1..N : round[p] <= 5

\* Invariants to check (Safety Properties)
INVARIANTS
    TypeOK
    Agreement
    Validity

\* Properties to check
PROPERTIES
    Termination
