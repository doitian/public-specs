openapi: 3.0.3
info:
  title: Raindrop Bookmarks by Date API
  description: |
    Client library for fetching Raindrop.io bookmarks from the last N days.
    This is a wrapper around the Raindrop.io REST API that simplifies date-based filtering.
  version: 1.0.0
  contact:
    name: API Support

servers:
  - url: https://api.raindrop.io/rest/v1
    description: Raindrop.io Production API

security:
  - bearerAuth: []

paths:
  /raindrops/{collectionId}:
    get:
      summary: Get bookmarks from the last N days
      description: |
        Fetches all bookmarks created within the last N days from a specific collection.
        Handles pagination automatically to return all matching results.
      operationId: getBookmarksByDate
      parameters:
        - name: collectionId
          in: path
          required: true
          description: |
            Collection ID to fetch from:
            - 0: All bookmarks (excluding Trash)
            - -1: Unsorted bookmarks
            - -99: Trash
            - Positive integer: Specific user collection
          schema:
            type: integer
            default: 0
            example: 0
        - name: search
          in: query
          required: true
          description: |
            Search filter using created date syntax.
            Format: `created:>YYYY-MM-DD` where date is (today - N days)
          schema:
            type: string
            example: "created:>2025-11-23"
        - name: sort
          in: query
          required: false
          description: Sort order for results
          schema:
            type: string
            enum:
              - "-created"
              - "created"
              - "-title"
              - "title"
              - "-domain"
              - "domain"
            default: "-created"
        - name: perpage
          in: query
          required: false
          description: Number of items per page (max 50)
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 50
        - name: page
          in: query
          required: false
          description: Page number (0-indexed)
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: nested
          in: query
          required: false
          description: Include bookmarks from nested collections
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Successful response with bookmarks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RaindropListResponse"
        "401":
          description: Unauthorized - Invalid or expired access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Collection not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded (120 requests/minute)
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: OAuth 2.0 Bearer token from Raindrop.io

  schemas:
    RaindropListResponse:
      type: object
      required:
        - result
        - items
        - count
      properties:
        result:
          type: boolean
          description: Whether the request was successful
          example: true
        items:
          type: array
          items:
            $ref: "#/components/schemas/Raindrop"
        count:
          type: integer
          description: Total count of matching items
          example: 25

    Raindrop:
      type: object
      required:
        - _id
        - title
        - link
        - created
      properties:
        _id:
          type: integer
          description: Unique bookmark identifier
          example: 123456789
        title:
          type: string
          description: Bookmark title
          example: "How to Use the Raindrop.io API"
        link:
          type: string
          format: uri
          description: Bookmarked URL
          example: "https://developer.raindrop.io/"
        created:
          type: string
          format: date-time
          description: When the bookmark was created (ISO 8601)
          example: "2025-11-25T10:30:00Z"
        lastUpdate:
          type: string
          format: date-time
          description: When the bookmark was last updated
          example: "2025-11-25T10:30:00Z"
        tags:
          type: array
          items:
            type: string
          description: User-assigned tags
          example: ["api", "bookmarks", "raindrop"]
        collection:
          type: object
          properties:
            $id:
              type: integer
              description: Collection ID
              example: 12345
        excerpt:
          type: string
          description: Page excerpt or user description
          example: "Official API documentation for Raindrop.io"
        domain:
          type: string
          description: Domain of the bookmarked URL
          example: "developer.raindrop.io"
        cover:
          type: string
          format: uri
          description: Cover image URL
          example: "https://developer.raindrop.io/og-image.png"
        type:
          type: string
          enum:
            - link
            - article
            - image
            - video
            - document
            - audio
          description: Type of content
          example: "article"

    ErrorResponse:
      type: object
      required:
        - result
        - errorMessage
      properties:
        result:
          type: boolean
          example: false
        errorMessage:
          type: string
          description: Human-readable error message
          example: "Invalid access token"
        error:
          type: integer
          description: Error code
          example: 401

    # Client wrapper types (not from Raindrop API)
    BookmarkRequest:
      type: object
      required:
        - days
      properties:
        days:
          type: integer
          minimum: 1
          description: Number of days to look back
          example: 7
        collection_id:
          type: integer
          default: 0
          description: Collection ID (0 = all)
          example: 0
        include_nested:
          type: boolean
          default: false
          description: Include nested collections
          example: false

    BookmarkResponse:
      type: object
      required:
        - bookmarks
        - count
        - from_date
        - to_date
      properties:
        bookmarks:
          type: array
          items:
            $ref: "#/components/schemas/Bookmark"
        count:
          type: integer
          description: Total count of bookmarks
          example: 25
        from_date:
          type: string
          format: date
          description: Start of date range
          example: "2025-11-23"
        to_date:
          type: string
          format: date
          description: End of date range (today)
          example: "2025-11-30"

    Bookmark:
      type: object
      description: Simplified bookmark model for client use
      required:
        - id
        - title
        - link
        - created
      properties:
        id:
          type: integer
          example: 123456789
        title:
          type: string
          example: "How to Use the Raindrop.io API"
        link:
          type: string
          format: uri
          example: "https://developer.raindrop.io/"
        created:
          type: string
          format: date-time
          example: "2025-11-25T10:30:00Z"
        tags:
          type: array
          items:
            type: string
          example: ["api", "bookmarks"]
        collection_id:
          type: integer
          nullable: true
          example: 12345
        excerpt:
          type: string
          nullable: true
          example: "Official API documentation"
        domain:
          type: string
          nullable: true
          example: "developer.raindrop.io"
        cover:
          type: string
          format: uri
          nullable: true
          example: "https://developer.raindrop.io/og-image.png"
